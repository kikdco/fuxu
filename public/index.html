<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="肤序：结合成分解析、护肤流程与个人观察数据的护肤管理工具。"
    />
    <title>肤序 · 个人护肤实验室</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#today" data-nav="today" aria-label="回到今日护肤">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
          </span>
          <span class="brand-copy">
            <strong>肤序</strong>
            <small>SKIN SEQUENCE</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="主要导航">
          <button class="nav-item is-active" type="button" data-nav="today">
            <span class="nav-icon" data-icon="house"></span>
            <span>今日护肤</span>
          </button>
          <button class="nav-item" type="button" data-nav="vanity">
            <span class="nav-icon" data-icon="archive"></span>
            <span>我的化妆台</span>
          </button>
          <button class="nav-item" type="button" data-nav="analysis">
            <span class="nav-icon" data-icon="chart"></span>
            <span>分析与工具</span>
          </button>
          <button class="nav-item" type="button" data-nav="experiment">
            <span class="nav-icon" data-icon="flask"></span>
            <span>个人观察</span>
          </button>
        </nav>

        <div class="sidebar-note">
          <div class="sidebar-note-head">
            <span class="nav-icon" data-icon="sparkles"></span>
            <span>本周洞察</span>
          </div>
          <p id="sidebarInsight">正在整理你的产品组合...</p>
          <button class="text-link light" type="button" data-action="open-analysis">
            查看分析
            <span class="inline-icon" data-icon="arrow-up-right"></span>
          </button>
        </div>

        <div class="sidebar-profile">
          <span class="avatar" id="sidebarAvatar">林</span>
          <span class="sidebar-profile-copy">
            <strong id="sidebarName">林知夏</strong>
            <small id="sidebarSkin">混合偏油 · 轻度敏感</small>
          </span>
          <button
            class="icon-button subtle"
            type="button"
            data-action="open-profile"
            aria-label="编辑个人档案"
            data-tooltip="编辑档案"
          >
            <span class="inline-icon" data-icon="settings"></span>
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <a class="mobile-brand" href="#today" data-nav="today" aria-label="肤序首页">
            <span class="brand-mark small" aria-hidden="true"><span></span></span>
            <strong>肤序</strong>
          </a>
          <div class="page-heading">
            <span id="pageEyebrow">TODAY / 10.18</span>
            <h1 id="pageTitle">今日护肤</h1>
          </div>
          <div class="topbar-actions">
            <button class="secondary-button" type="button" data-action="open-profile">
              <span class="inline-icon" data-icon="droplets"></span>
              <span id="profileSummary">混合偏油</span>
            </button>
            <button class="primary-button" type="button" data-action="open-add-product">
              <span class="inline-icon" data-icon="plus"></span>
              <span>添加产品</span>
            </button>
          </div>
        </header>

        <main class="app-content" id="app" aria-live="polite"></main>
      </div>
    </div>

    <div class="modal-root" id="modalRoot"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
